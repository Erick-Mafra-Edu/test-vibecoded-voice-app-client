[package]
name = "pulse"
version = "0.1.0"
edition = "2021"
authors = ["PULSE Dev <pulse@beamvoice.app>"]
description = "PULSE — Low-Latency Voice Hub (Frontend Prototype)"
repository = "https://github.com/beamvoice/pulse-client"
license = "MIT"

[[bin]]
name = "pulse"
path = "src/main.rs"
test = false

[dependencies]
bytes = "1"
iced = { version = "0.14", features = ["advanced", "image", "svg", "canvas", "tokio"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
async-trait = "0.1"
serde_json = "1"
dotenvy = "0.15"
rand = "0.8"
chrono = { version = "0.4", features = ["clock"] }
once_cell = "1"
log = "0.4"
env_logger = "0.11"
cpal = "0.15"
opus = "0.4"
rtc = "0.21.1"
screenshots = "0.8"
webrtc = "0.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
