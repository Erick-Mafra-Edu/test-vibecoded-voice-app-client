name: Build and release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test signaling
        run: cargo test --lib --locked
      - name: Test token switching
        run: cargo test --bin pulse --locked changing_token_retries_immediately_after_authentication_failure
      - name: Build Windows client
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: pulse-windows-${{ github.sha }}
          path: target/release/pulse.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: rust
      - uses: actions/download-artifact@v8
        if: steps.release.outputs.release_created == 'true'
        with:
          name: pulse-windows-${{ github.sha }}
          path: release
      - name: Attach Windows executable to release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/pulse.exe --repo "$GITHUB_REPOSITORY"
